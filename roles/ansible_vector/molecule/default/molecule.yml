---
driver:
  name: docker

# Dependency management (download roles/collections)
dependency:
  name: galaxy

lint: |
  ansible-lint .
  yamllint .

platforms:
  - name: centos7
    image: geerlingguy/docker-centos7-ansible:latest
    command: ""
    privileged: true
    pre_build_image: true
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /tmp
    capabilities:
      - SYS_ADMIN
    ansible_python_interpreter: /usr/bin/python
  
  - name: centos8
    image: geerlingguy/docker-centos8-ansible:latest
    pre_build_image: true
    command: ""
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /tmp
    capabilities:
      - SYS_ADMIN
    ansible_python_interpreter: /usr/bin/python

  - name: ubuntu2204
    image: geerlingguy/docker-ubuntu2204-ansible:latest
    pre_build_image: true
    command: ""
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /tmp
    capabilities:
      - SYS_ADMIN
    ansible_python_interpreter: /usr/bin/python3



provisioner:
  name: ansible

scenario:
  name: default
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - side_effect
    - verify
    - cleanup
    - destroy


role_name_check: 1